    $$('[data-k]', root).forEach((b) => (b.onclick = async () => {
      const k = b.dataset.k;
      if (k === 'bk') st.v = st.v.slice(0, -1); else if (st.v.length < 4) st.v += k;
      if (st.v.length === 4) {
        if (st.stage === 'new') { st.first = st.v; st.v = ''; st.stage = 'repeat'; }
        else if (st.stage === 'repeat') {
          if (st.v === st.first) { S.pin = await hash(st.v); App.save(); unlocked = true; App.toast('PIN gespeichert'); App.replace((r) => parents(r), { tab: 'mehr' }); return; }
          App.toast('Die PINs stimmen nicht überein.'); st.v = ''; st.stage = 'new';
        } else {
          if ((await hash(st.v)) === S.pin) { unlocked = true; App.replace((r) => parents(r), { tab: 'mehr' }); return; }
          App.toast('Falsche PIN'); st.v = '';
        }
      }
      App.redraw(true);
    }));
    const fg = $('[data-forgot]', root);
    if (fg) fg.onclick = async () => {
      const ok = await App.ask({ title: 'PIN zurücksetzen?', text: 'Aus Sicherheitsgründen wird dabei auch der gespeicherte KI-Schlüssel gelöscht. Der Lernfortschritt bleibt erhalten.', ok: 'Zurücksetzen', danger: true });
      if (!ok) return;
      S.pin = ''; S.ai.key = ''; App.save(); st.stage = 'new'; st.v = ''; App.redraw();
    };
  }

  function parents(root) {
    const S = App.S;
    const custom = !MODELS.some((m) => m.id === S.ai.model);
    const key = S.ai.key || '';
    let s = App.topbar('Elternbereich', { right: '<button class="iconbtn" data-lock aria-label="Sperren">' + App.icon('lock') + '</button>' });
    // KI
    s += '<div class="sec-t" style="margin-top:6px">KI-Nachhilfe</div><div class="card">' +
      '<label class="switch"><span>Nachhilfe eingeschaltet</span><input type="checkbox" data-on' + (S.ai.on ? ' checked' : '') + '></label>' +
      '<label class="fld"><span>API-Schlüssel (Claude-Konsole)</span><input class="inp" type="password" data-key autocomplete="off" spellcheck="false" placeholder="sk-ant-…" value="' + esc(key) + '"></label>' +
      '<p class="small muted" style="margin:-6px 0 14px">' + (key ? 'Gespeichert: …' + esc(key.slice(-4)) : 'Noch kein Schlüssel hinterlegt.') + '</p>' +
      '<label class="fld"><span>Modell</span><select class="inp" data-model>' + MODELS.map((m) => '<option value="' + m.id + '"' + (S.ai.model === m.id ? ' selected' : '') + '>' + m.name + '</option>').join('') + '<option value="__custom"' + (custom ? ' selected' : '') + '>Eigene Modell-ID …</option></select></label>' +
      '<label class="fld' + (custom ? '' : ' hidden') + '" data-cwrap><span>Eigene Modell-ID</span><input class="inp" data-custom value="' + (custom ? esc(S.ai.model) : '') + '" placeholder="z. B. claude-haiku-4-5-20251001"></label>' +
      '<label class="fld"><span>Fragen pro Tag</span><select class="inp" data-limit>' + [5, 10, 20, 30, 50].map((n) => '<option' + (S.ai.limit === n ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label>' +
      '<div class="btns"><button class="btn" data-save>Speichern</button><button class="btn line" data-test>Verbindung testen</button></div>' +
      '<div data-testres class="mt"></div>' +
      '<p class="note mt mb0">Empfehlung: In der Claude-Konsole einen eigenen Workspace „Mathe“ anlegen, dort ein <b>monatliches Ausgabenlimit</b> setzen und den Schlüssel erzeugen. Der Schlüssel bleibt nur auf diesem Gerät. Heute genutzt: ' + used() + ' von ' + S.ai.limit + ' Fragen · insgesamt ' + S.ai.total + '.</p></div>';
    // Fortschritt
    s += '<div class="sec-t">Fortschritt</div><div class="card"><table class="ptable">';
    M6.chapters.forEach((ch) => {
      const p = App.chapterProgress(ch), t = S.tests[ch.id];
      const read = ch.lessons.filter((l) => S.read[App.lkey(ch, l)]).length;
      s += '<tr><td><b>' + ch.nr + ' ' + esc(ch.title) + '</b><br><span class="small muted">' + read + ' von ' + ch.lessons.length + ' Texten gelesen' + (t && t.last ? ' · letzter Test: Note ' + t.last.grade + ' (' + App.fmtDate(t.last.date) + ')' : '') + '</span></td><td>★ ' + p.got + '/' + p.max + (t && t.best ? '<br>Note ' + t.best : '') + '</td></tr>';
    });
    let sure = 0; for (let a = 1; a <= 10; a++) for (let b = a; b <= 10; b++) { const f = S.trainer.facts[a + 'x' + b]; if (f && f.s >= 3) sure++; }
    const openErr = Object.values(S.trainer.facts).filter((f) => f.w > 0 && (f.s || 0) < 3).length;
    s += '</table><table class="ptable mt">' +
      '<tr><td>Übungsrunden</td><td>' + S.rounds + '</td></tr>' +
      '<tr><td>Aufgaben richtig / bearbeitet</td><td>' + S.correct + ' / ' + S.answered + '</td></tr>' +
      '<tr><td>Kleines 1×1 sicher</td><td>' + sure + ' von 55</td></tr>' +
      '<tr><td>Offene 1×1-Fehler</td><td>' + openErr + '</td></tr>' +
      '<tr><td>Kopfrechenaufgaben richtig</td><td>' + S.trainer.total + '</td></tr>' +
      '<tr><td>Level / XP</td><td>' + App.lvlOf(S.xp) + ' / ' + S.xp + '</td></tr>' +
      '<tr><td>Übungstage insgesamt</td><td>' + S.days.length + '</td></tr>' +
      '<tr><td>Zuletzt aktiv</td><td>' + App.fmtDate(S.days[S.days.length - 1]) + '</td></tr></table></div>';
    // Daten
    s += '<div class="sec-t">Daten</div><div class="card"><p class="small muted" style="margin-top:0">Der Fortschritt liegt nur im Speicher dieses Handys. Eine Sicherung (ohne Schlüssel und PIN) schützt vor Verlust, z. B. vor einem Handywechsel.</p>' +
      '<div class="btns" style="flex-wrap:wrap"><button class="btn line" data-exp>Sicherung speichern</button><button class="btn line" data-imp>Sicherung laden</button></div>' +
      '<input type="file" accept="application/json,.json" data-impfile hidden>' +
      '<div class="btns mt"><button class="btn line" data-pin>PIN ändern</button><button class="btn line" data-reset style="color:var(--bad)">Fortschritt löschen</button></div></div>' +
      '<p class="small muted center">Mathe 6 · Version ' + App.VERSION + '</p>';
    root.innerHTML = s;

    $('[data-lock]', root).onclick = () => { unlocked = false; App.back(); };
    const sel = $('[data-model]', root);
    sel.onchange = () => $('[data-cwrap]', root).classList.toggle('hidden', sel.value !== '__custom');
    const collect = () => {
      S.ai.on = $('[data-on]', root).checked;
      S.ai.key = $('[data-key]', root).value.trim();
      S.ai.model = sel.value === '__custom' ? ($('[data-custom]', root).value.trim() || MODELS[0].id) : sel.value;
      S.ai.limit = Number($('[data-limit]', root).value);
      App.save();
    };
    $('[data-save]', root).onclick = () => { collect(); App.toast('Gespeichert'); App.redraw(true); };
    $('[data-on]', root).onchange = () => { collect(); };
    $('[data-test]', root).onclick = async () => {
      collect();
      const out = $('[data-testres]', root);
      if (!S.ai.key) { out.innerHTML = '<div class="warn">Bitte zuerst einen Schlüssel eintragen.</div>'; return; }
      out.innerHTML = '<div class="note">Teste die Verbindung …</div>';
      try {
        const a = await callClaude('Antworte nur mit dem Wort OK.', [{ role: 'user', content: 'Test' }], 10);
        out.innerHTML = '<div class="note" style="border-color:var(--ok);background:var(--ok-soft)">✓ Verbindung klappt (Modell ' + esc(S.ai.model) + ', Antwort: „' + esc(a.slice(0, 20)) + '“).</div>';
      } catch (e) { out.innerHTML = '<div class="warn">' + esc(errText(e, true)) + '</div>'; }
    };
    $('[data-exp]', root).onclick = () => {
      const blob = new Blob([JSON.stringify(App.exportData(), null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mathe6-sicherung-' + App.today() + '.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    };
    $('[data-imp]', root).onclick = () => $('[data-impfile]', root).click();
    $('[data-impfile]', root).onchange = (e) => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = async () => {
        try {
          const obj = JSON.parse(r.result);
          if (typeof obj !== 'object' || obj.v !== 1) throw new Error('x');
          const ok = await App.ask({ title: 'Sicherung laden?', text: 'Der aktuelle Fortschritt wird durch die Sicherung vom ' + App.fmtDate((obj.exportiert || '').slice(0, 10)) + ' ersetzt.', ok: 'Laden' });
          if (!ok) return;
          App.importData(obj); App.applyTheme(); App.toast('Sicherung geladen'); App.redraw();
        } catch (x) { App.toast('Diese Datei ist keine gültige Sicherung.'); }
      };
      r.readAsText(f);
    };
    $('[data-pin]', root).onclick = () => { S.pin = ''; App.save(); unlocked = false; App.replace((r, st) => pinScreen(r, st), { tab: 'mehr', st: { stage: 'new' } }); };
    $('[data-reset]', root).onclick = async () => {
      const ok = await App.ask({ title: 'Wirklich alles löschen?', text: 'Sterne, XP, Abzeichen, Bestwerte und 1×1-Statistik werden gelöscht. Name, PIN und KI-Einstellungen bleiben.', ok: 'Löschen', danger: true });
      if (!ok) return;
      const ok2 = await App.ask({ title: 'Ganz sicher?', text: 'Das kann nicht rückgängig gemacht werden (außer mit einer Sicherung).', ok: 'Ja, löschen', danger: true });
      if (!ok2) return;
      App.resetAll(true); App.applyTheme(); App.toast('Fortschritt gelöscht'); App.redraw();
    };
  }
})();

App.start();
</script>
</body>
</html>
