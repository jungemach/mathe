<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b50c8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mathe 6">
<meta name="description" content="Mathe-Lern-App für die 6. Klasse (Gymnasium Hessen): Lerntexte, Übungen, Kapiteltests, Kopfrechentrainer.">
<title>Mathe 6</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ===== Mathe 6 – Rechenheft-Optik ===== */
:root {
  --accent: #2b50c8;
  --paper: #f4f7fb;
  --card: #ffffff;
  --card2: #f7f9fd;
  --karo: #e2e9f4;
  --ink: #1a2335;
  --ink2: #5b6579;
  --ink3: #8a93a6;
  --rule: #d8e0ec;
  --ok: #17924d;
  --ok-soft: #e3f5ea;
  --bad: #d2392d;
  --bad-soft: #fde8e6;
  --gold: #e7a900;
  --shadow: 0 1px 2px rgba(20, 35, 70, .06), 0 2px 10px rgba(20, 35, 70, .06);
  --acc: var(--accent);
  --acc-soft: color-mix(in srgb, var(--accent) 12%, var(--card));
  --acc-mid: color-mix(in srgb, var(--accent) 55%, var(--card));
  --r: 14px;
  --nav: 64px;
  color-scheme: light;
}
:root[data-theme="tuerkis"] { --accent: #0b8796; }
:root[data-theme="gruen"] { --accent: #1b8a4a; }
:root[data-theme="lila"] { --accent: #6d44d4; }
:root[data-theme="orange"] { --accent: #d2600a; }
:root[data-theme="beere"] { --accent: #bf2a6b; }

@media (prefers-color-scheme: dark) {
  :root:not([data-mode="hell"]) {
    --paper: #151d1b; --card: #1d2825; --card2: #22302c; --karo: #26332f; --ink: #ecf2ee; --ink2: #a9b8b2; --ink3: #7d8e88;
    --rule: #33443f; --ok: #3ccf7a; --ok-soft: #1c3a2a; --bad: #ff7466; --bad-soft: #43231f; --gold: #f5c542;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --acc: color-mix(in srgb, var(--accent) 62%, #ffffff);
    --acc-soft: color-mix(in srgb, var(--accent) 22%, var(--card));
    --acc-mid: color-mix(in srgb, var(--acc) 70%, var(--card));
    color-scheme: dark;
  }
}
:root[data-mode="dunkel"] {
  --paper: #151d1b; --card: #1d2825; --card2: #22302c; --karo: #26332f; --ink: #ecf2ee; --ink2: #a9b8b2; --ink3: #7d8e88;
  --rule: #33443f; --ok: #3ccf7a; --ok-soft: #1c3a2a; --bad: #ff7466; --bad-soft: #43231f; --gold: #f5c542;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --acc: color-mix(in srgb, var(--accent) 62%, #ffffff);
  --acc-soft: color-mix(in srgb, var(--accent) 22%, var(--card));
  --acc-mid: color-mix(in srgb, var(--acc) 70%, var(--card));
  color-scheme: dark;
}

[data-tint] { --acc: var(--accent); --acc-soft: color-mix(in srgb, var(--accent) 12%, var(--card)); --acc-mid: color-mix(in srgb, var(--accent) 55%, var(--card)); }
@media (prefers-color-scheme: dark) { :root:not([data-mode="hell"]) [data-tint] { --acc: color-mix(in srgb, var(--accent) 62%, #fff); --acc-soft: color-mix(in srgb, var(--accent) 22%, var(--card)); --acc-mid: color-mix(in srgb, var(--acc) 70%, var(--card)); } }
:root[data-mode="dunkel"] [data-tint] { --acc: color-mix(in srgb, var(--accent) 62%, #fff); --acc-soft: color-mix(in srgb, var(--accent) 22%, var(--card)); --acc-mid: color-mix(in srgb, var(--acc) 70%, var(--card)); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.5; color: var(--ink); background-color: var(--paper);
  background-image: linear-gradient(var(--karo) 1px, transparent 1px), linear-gradient(90deg, var(--karo) 1px, transparent 1px);
  background-size: 22px 22px; background-attachment: fixed;
  min-height: 100vh; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
sup { font-size: .7em; line-height: 0; }
b { font-weight: 700; }
.tnum { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

#app { max-width: 560px; margin: 0 auto; min-height: 100vh; position: relative; }
#main { padding: 0 16px calc(var(--nav) + 28px); }
#main.nonav { padding-bottom: 120px; }

/* ---------- Kopfzeile ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; margin: 0 -16px 12px; padding: 10px 12px;
  background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); min-height: 56px; }
.top h1 { font-size: 18px; margin: 0; flex: 1; line-height: 1.2; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; flex: none; }
.iconbtn:active { background: var(--acc-soft); }
.iconbtn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Navigation unten ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: calc(var(--nav) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--rule); }
.nav-in { display: flex; width: 100%; max-width: 560px; }
.nav button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--ink3); font-weight: 600; }
.nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav button.on { color: var(--acc); }
.nav button.on svg { stroke-width: 2.4; }

/* ---------- Karten, Listen ---------- */
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--rule); padding: 16px; margin-bottom: 12px; }
.sec-t { font-size: 15px; font-weight: 750; color: var(--ink2); margin: 22px 2px 8px; }
.muted { color: var(--ink2); }
.small { font-size: 14px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.list { background: var(--card); border-radius: var(--r); border: 1px solid var(--rule); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 0; background: none; width: 100%; text-align: left; border-top: 1px solid var(--rule); min-height: 58px; }
.li:first-child { border-top: 0; }
.li:active { background: var(--acc-soft); }
.li .num { font-weight: 800; color: var(--acc); min-width: 34px; font-variant-numeric: tabular-nums; }
.li .t { font-weight: 650; line-height: 1.25; }
.li .s { font-size: 13px; color: var(--ink2); }
.lic { width: 22px; height: 22px; fill: none; stroke: var(--acc); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chev { width: 18px; height: 18px; stroke: var(--ink3); fill: none; stroke-width: 2.2; flex: none; }

/* ---------- Knöpfe ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 13px; padding: 13px 18px; font-weight: 700; font-size: 16px;
  background: var(--acc); color: #fff; min-height: 50px; }
:root[data-mode="dunkel"] .btn { color: #0f1715; }
@media (prefers-color-scheme: dark) { :root:not([data-mode="hell"]) .btn { color: #0f1715; } }
.btn:active { transform: translateY(1px); filter: brightness(.95); }
.btn.block { width: 100%; }
.btn.ghost { background: var(--acc-soft); color: var(--acc); }
.btn.line { background: var(--card); color: var(--ink); border: 1.5px solid var(--rule); }
.btn.ok { background: var(--ok); }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: 15px; border-radius: 11px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btns { display: flex; gap: 10px; }
.btns > * { flex: 1; }

/* ---------- Startseite ---------- */
.hello { padding: 22px 2px 6px; display: flex; align-items: flex-start; gap: 12px; }
.hello h1 { font-size: 26px; line-height: 1.15; margin: 0 0 6px; font-weight: 800; letter-spacing: -.01em; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 14px; font-weight: 650; }
.chip .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--acc); color: #fff; font-size: 12px; font-weight: 800; }
.xpbar { height: 8px; border-radius: 99px; background: var(--acc-soft); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; transition: width .6s ease; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0 4px; }
.tile { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 10px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; line-height: 1.2; }
.tile .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc); font-size: 20px; font-weight: 800; }
.tile .ic svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.tile:active { transform: scale(.98); }
.cont { display: flex; align-items: center; gap: 12px; border-left: 5px solid var(--acc); }
.cont .k { font-size: 13px; color: var(--ink2); font-weight: 600; }
.cont .t { font-weight: 750; }

/* Kapitel als Heftumschläge */
.heft { position: relative; display: flex; align-items: stretch; width: 100%; text-align: left; border: 1px solid var(--rule); background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 0; margin-bottom: 10px; overflow: hidden; }
.heft .spine { width: 58px; flex: none; background: var(--hc); color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 850; position: relative; }
.heft .spine::after { content: ""; position: absolute; right: 8px; top: 0; bottom: 0; border-right: 2px dotted rgba(255,255,255,.45); }
.heft .body { flex: 1; padding: 12px 14px; min-width: 0; }
.heft .t { font-weight: 750; font-size: 16.5px; line-height: 1.25; }
.heft .s { font-size: 13px; color: var(--ink2); margin-bottom: 8px; }
.heft .prog { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); font-weight: 600; }
.heft .prog .bar { flex: 1; height: 6px; border-radius: 9px; background: color-mix(in srgb, var(--hc) 15%, var(--card)); overflow: hidden; }
.heft .prog .bar i { display: block; height: 100%; background: var(--hc); }
.heft:active { transform: scale(.99); }

/* Kapitelkopf */
.chead { margin: 0 -16px 14px; padding: 16px 18px 18px; background: var(--hc); color: #fff; }
.chead .n { font-size: 14px; opacity: .85; font-weight: 700; }
.chead h2 { margin: 2px 0 6px; font-size: 24px; line-height: 1.15; }
.chead p { margin: 0; opacity: .92; font-size: 15px; }
.chead .top { background: transparent; border: 0; margin: -16px -18px 4px; padding: 8px 6px; backdrop-filter: none; -webkit-backdrop-filter: none; position: static; min-height: 0; }
.chead .iconbtn { color: #fff; }
.chead .iconbtn:active { background: rgba(255,255,255,.18); }

.stars { display: inline-flex; gap: 2px; flex: none; }
.stars svg { width: 18px; height: 18px; }
.stars .on { fill: var(--gold); stroke: var(--gold); }
.stars .off { fill: none; stroke: var(--ink3); stroke-width: 1.6; }
.pill { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--acc-soft); color: var(--acc); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.readdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-left: 6px; vertical-align: middle; }

/* Segmente */
.seg { display: flex; background: var(--card2); border: 1px solid var(--rule); border-radius: 13px; padding: 4px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 10px; font-weight: 700; color: var(--ink2); }
.seg button.on { background: var(--card); color: var(--acc); box-shadow: var(--shadow); }

/* ---------- Lerntexte ---------- */
.learn { font-size: 16.5px; line-height: 1.6; }
.learn h3 { font-size: 18.5px; margin: 22px 0 8px; line-height: 1.3; }
.learn h3:first-child { margin-top: 4px; }
.learn p { margin: 0 0 12px; }
.learn ul, .learn ol { margin: 0 0 12px; padding-left: 22px; }
.learn li { margin-bottom: 4px; }
.merk, .bsp, .tipp { border-radius: 12px; padding: 12px 14px; margin: 14px 0; }
.merk { background: var(--acc-soft); border-left: 5px solid var(--acc); }
.merk > b:first-child, .bsp > b:first-child, .tipp > b:first-child { display: block; margin-bottom: 4px; }
.merk > b:first-child { color: var(--acc); }
.bsp { background: var(--card2); border: 1.5px dashed var(--rule); }
.tipp { background: color-mix(in srgb, var(--gold) 14%, var(--card)); border-left: 5px solid var(--gold); }
.tipp > b:first-child { color: color-mix(in srgb, var(--gold) 70%, var(--ink)); }
.merk p:last-child, .bsp p:last-child, .tipp p:last-child { margin-bottom: 0; }
.golink { border: 0; background: var(--acc); color: #fff; font-weight: 700; padding: 10px 16px; border-radius: 12px; }

/* Tabellen */
.tb { border-collapse: collapse; margin: 10px 0; font-variant-numeric: tabular-nums; max-width: 100%; }
.tb th, .tb td { border: 1px solid var(--rule); padding: 5px 9px; text-align: center; }
.tb th { background: var(--card2); font-weight: 700; font-size: 14px; }
.tblwrap, .learn .tb, .q .tb, .sol .tb { display: block; overflow-x: auto; }

/* Brüche */
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .12em; line-height: 1.05; font-size: .92em; font-variant-numeric: tabular-nums; }
.fr > span:first-child { border-bottom: 1.6px solid currentColor; padding: 0 .18em 1px; }
.fr > span:last-child { padding: 1px .18em 0; }
.mx { white-space: nowrap; }
.mx .fr { margin-left: .08em; }
.ov { text-decoration: overline; text-decoration-thickness: 1.5px; }

/* ---------- Figuren ---------- */
svg.fig { max-width: 100%; height: auto; display: block; margin: 8px auto; overflow: visible; }
svg.fig .sh { fill: var(--acc-mid); stroke: var(--ink); stroke-width: 1.5; }
svg.fig .un { fill: var(--card); stroke: var(--ink); stroke-width: 1.5; }
svg.fig .ln { stroke: var(--ink); stroke-width: 2; fill: none; }
svg.fig .aux { stroke: var(--ink3); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
svg.fig text, svg.fig .lb { fill: var(--ink); font-size: 14px; text-anchor: middle; font-family: inherit; }
svg.fig .lb.sm { font-size: 11.5px; }
svg.fig .ax { stroke: var(--ink); stroke-width: 2; }
svg.fig .axh { fill: var(--ink); }
svg.fig .tk { stroke: var(--ink); stroke-width: 1.3; }
svg.fig .tk.big { stroke-width: 2; }
svg.fig .mk { fill: var(--acc); }
svg.fig .mk.ok { fill: var(--ok); }
svg.fig .mk.bad { fill: var(--bad); }
svg.fig .mkl { font-weight: 700; fill: var(--acc); }
svg.fig .gl { stroke: var(--rule); stroke-width: 1; }
svg.fig .bar { fill: var(--acc-mid); stroke: var(--acc); stroke-width: 1.2; }
svg.fig .c0 { fill: var(--acc); } svg.fig .c1 { fill: #f2a93b; } svg.fig .c2 { fill: #3fb68b; } svg.fig .c3 { fill: #e05d7a; } svg.fig .c4 { fill: #8b7be0; } svg.fig .c5 { fill: #58b4e0; } svg.fig .c6 { fill: #b0a27a; }
svg.fig.pie path, svg.fig.pie circle { stroke: var(--card); stroke-width: 2; }
/* Winkel */
svg.fig .prot { fill: color-mix(in srgb, var(--acc) 7%, transparent); stroke: var(--acc); stroke-width: 1.2; }
svg.fig .ptk { stroke: var(--acc); stroke-width: 1; }
svg.fig .plb { font-size: 8.5px; fill: var(--acc); text-anchor: middle; }
svg.fig .pc { fill: var(--acc); }
svg.fig .arc { stroke: var(--bad); stroke-width: 2; fill: none; }
svg.fig .alb { fill: var(--bad); font-weight: 700; font-size: 16px; }
svg.fig .leg { stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; }
svg.fig .leg.drag { stroke: var(--acc); }
svg.fig .vx { fill: var(--ink); }
svg.fig .handle { fill: var(--acc); stroke: var(--card); stroke-width: 3; }
svg.fig .handle-ring { fill: color-mix(in srgb, var(--acc) 22%, transparent); }
svg.fig .leg.ok { stroke: var(--ok); stroke-dasharray: 6 5; }
/* Karogitter */
svg.fig .gbg { fill: var(--card); }
svg.fig .gline { stroke: var(--karo); stroke-width: 1; }
:root[data-mode="dunkel"] svg.fig .gline { stroke: #34453f; }
svg.fig .gp { stroke-width: 2.2; stroke-linejoin: round; }
svg.fig .gp.orig { fill: color-mix(in srgb, var(--acc) 18%, transparent); stroke: var(--acc); }
svg.fig .gp.img { fill: color-mix(in srgb, var(--gold) 20%, transparent); stroke: color-mix(in srgb, var(--gold) 80%, var(--ink)); }
svg.fig .gp.aux { fill: none; stroke: var(--ink3); stroke-dasharray: 5 4; }
svg.fig .gp.user { fill: color-mix(in srgb, var(--ink) 8%, transparent); stroke: var(--ink); }
svg.fig .gp.ok { fill: color-mix(in srgb, var(--ok) 15%, transparent); stroke: var(--ok); stroke-dasharray: 6 4; }
svg.fig .gl2 { stroke-width: 2.2; }
svg.fig .gl2.axis { stroke: var(--bad); stroke-dasharray: 8 5; }
svg.fig .gl2.aux { stroke: var(--ink3); stroke-dasharray: 5 4; }
svg.fig .gl2.orig { stroke: var(--acc); }
svg.fig .gl2.vec { stroke: var(--ok); stroke-width: 2.6; }
svg.fig .vech { fill: var(--ok); }
svg.fig .gpt { stroke: var(--card); stroke-width: 1.5; }
svg.fig .gpt.orig { fill: var(--acc); }
svg.fig .gpt.img { fill: color-mix(in srgb, var(--gold) 80%, var(--ink)); }
svg.fig .gpt.center { fill: var(--bad); }
svg.fig .gpt.user { fill: var(--ink); }
svg.fig .gpt.ok { fill: var(--ok); }
svg.fig .glb { font-size: 13px; font-weight: 700; text-anchor: start; fill: var(--ink); }
svg.fig .glb.user { fill: var(--ink); }
svg.fig .glb.ok { fill: var(--ok); }
svg.tap { touch-action: none; cursor: crosshair; }

/* ---------- Aufgaben ---------- */
.play-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; margin: 0 -16px 10px; padding: 10px 12px; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.dots { flex: 1; display: flex; gap: 4px; }
.dots i { flex: 1; height: 8px; border-radius: 9px; background: var(--rule); }
.dots i.cur { background: var(--acc-mid); }
.dots i.ok { background: var(--ok); }
.dots i.half { background: color-mix(in srgb, var(--ok) 50%, var(--gold)); }
.dots i.bad { background: var(--bad); }
.dots i.done { background: var(--acc); }
.xpnow { font-weight: 800; font-size: 14px; color: var(--acc); white-space: nowrap; font-variant-numeric: tabular-nums; }
.task { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; position: relative; }
.task .meta { font-size: 13px; color: var(--ink3); font-weight: 650; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.q { font-size: 17.5px; line-height: 1.55; }
.q p { margin: 0 0 8px; }
.qfig { margin: 6px 0 2px; }
.ans { margin-top: 14px; }

/* Eingabefelder */
.inrow { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.field { min-width: 96px; min-height: 52px; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--rule); background: var(--card2); font-size: 24px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.field.foc { border-color: var(--acc); background: var(--card); box-shadow: 0 0 0 3px var(--acc-soft); }
.field.foc:empty::after, .field.foc.caret::after { content: ""; width: 2px; height: 26px; background: var(--acc); animation: blink 1s steps(1) infinite; margin-left: 2px; }
.field.ok { border-color: var(--ok); background: var(--ok-soft); }
.field.bad { border-color: var(--bad); background: var(--bad-soft); }
@keyframes blink { 50% { opacity: 0; } }
.unit { font-size: 20px; font-weight: 700; color: var(--ink2); }

@keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

<body>
<noscript>Diese App braucht JavaScript.</noscript>
<script>
/* Mathe 6 – Kern: Register, Helfer, Figuren, Antwortprüfung
   Läuft im Browser und in Node (für die automatischen Tests). */
(function (root) {
  'use strict';
  const M6 = (root.M6 = root.M6 || {});
  M6.chapters = [];
  M6.gens = {};
  M6.widgets = M6.widgets || {};

  M6.chapter = function (c) { M6.chapters.push(c); };
  M6.gen = function (id, fn) {
    if (M6.gens[id]) throw new Error('Doppelte Generator-ID: ' + id);
    M6.gens[id] = fn;
  };
  // Aufgabe erzeugen. Eintrag kann 'id' oder ['id', lvl] sein.
  M6.make = function (entry, lvl) {
    let id = entry, l = lvl || 1;
    if (Array.isArray(entry)) { id = entry[0]; l = entry[1] || l; }
    const fn = M6.gens[id];
    if (!fn) throw new Error('Unbekannter Generator: ' + id);
    const t = fn(h, { lvl: l });
    t.gid = id; t.lvl = l;
    return t;
  };

  /* ---------------- Helfer ---------------- */
  const h = (M6.h = {});

  // Zufall
  h.rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  h.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  h.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  h.sample = (arr, k) => h.shuffle(arr).slice(0, k);
  h.chance = (p) => Math.random() < p;
  h.range = (a, b, step = 1) => { const r = []; for (let x = a; x <= b; x += step) r.push(x); return r; };

  // Zahlentheorie
  h.gcd = function (...xs) {
    const g2 = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
    return xs.reduce((a, b) => g2(a, b));
  };
  h.lcm = function (...xs) { return xs.reduce((a, b) => Math.abs(a * b) / h.gcd(a, b)); };
  h.isPrime = (n) => { if (n < 2 || n % 1) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
  h.primes = (a, b) => h.range(a, b).filter(h.isPrime);
  h.pf = (n) => { const r = []; let m = n; for (let p = 2; p * p <= m; p++) while (m % p === 0) { r.push(p); m /= p; } if (m > 1) r.push(m); return r; };
  h.divisors = (n) => h.range(1, n).filter((d) => n % d === 0);
  h.digitsum = (n) => String(Math.abs(n)).split('').reduce((s, c) => s + Number(c), 0);

  // Brüche als {n, d}, immer gekürzt, Nenner positiv
  h.F = (n, d = 1) => {
    if (d === 0) throw new Error('Nenner 0');
    if (d < 0) { n = -n; d = -d; }
    const g = h.gcd(n, d) || 1;
    return { n: n / g, d: d / g };
  };
  h.fadd = (a, b) => h.F(a.n * b.d + b.n * a.d, a.d * b.d);
  h.fsub = (a, b) => h.F(a.n * b.d - b.n * a.d, a.d * b.d);
  h.fmul = (a, b) => h.F(a.n * b.n, a.d * b.d);
  h.fdiv = (a, b) => h.F(a.n * b.d, a.d * b.n);
  h.fval = (a) => a.n / a.d;
  h.fcmp = (a, b) => Math.sign(a.n * b.d - b.n * a.d);
  h.feq = (a, b) => h.fcmp(a, b) === 0;
  h.toMixed = (f) => ({ w: Math.trunc(f.n / f.d), n: Math.abs(f.n % f.d), d: f.d });

  // Rundung / Gleitkomma säubern
  h.fix = (x) => parseFloat(Number(x).toPrecision(12));
  h.round = (x, p = 0) => {
    const f = Math.pow(10, p);
    const v = h.fix(x * f);
    return h.fix((v < 0 ? -Math.round(-v) : Math.round(v)) / f);
  };

  // Zahlen deutsch formatieren: Komma, Tausender ab 10 000 mit schmalem Leerzeichen
  h.num = (x, opt) => {
    opt = opt || {};
    x = h.fix(x);
    const neg = x < 0; x = Math.abs(x);
    let s = opt.dec != null ? x.toFixed(opt.dec) : String(x);
    if (s.indexOf('e') >= 0) s = x.toFixed(10).replace(/0+$/, '').replace(/\.$/, '');
    let [ip, dp] = s.split('.');
    if (ip.length > 4 || opt.group) ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (neg ? '−' : '') + ip + (dp ? ',' + dp : '');
  };
  h.eur = (x) => h.num(x, { dec: 2 }) + ' €';

  // Bruch-HTML (data-t liefert Klartext für die KI)
  h.fr = (n, d) => {
    const neg = n < 0; n = Math.abs(n);
    return (neg ? '−' : '') + '<span class="fr" data-t="' + (neg ? '-' : '') + n + '/' + d + '"><span>' + n + '</span><span>' + d + '</span></span>';
  };
  h.mix = (w, n, d) => '<span class="mx" data-t="' + w + ' ' + n + '/' + d + '">' + w + '<span class="fr"><span>' + n + '</span><span>' + d + '</span></span></span>';
  // Bruch-Objekt anzeigen: ganze Zahl, echter/unechter Bruch oder gemischte Zahl
  h.frF = (f, mixed) => {
    if (f.d === 1) return h.num(f.n);
    if (mixed && Math.abs(f.n) > f.d) {
      const m = h.toMixed(f);
      return (f.n < 0 ? '−' : '') + h.mix(Math.abs(m.w), m.n, m.d);
    }
    return h.fr(f.n, f.d);
  };
  h.pow = (b, e) => (e === 1 ? String(b) : '<span data-t="' + b + '^' + e + '">' + b + '<sup>' + e + '</sup></span>');
  h.pfHTML = (arr) => {
    const c = {}; arr.forEach((p) => (c[p] = (c[p] || 0) + 1));
    return Object.keys(c).map(Number).sort((a, b) => a - b).map((p) => h.pow(p, c[p])).join(' · ');
  };
  h.pfProd = (arr) => arr.slice().sort((a, b) => a - b).join(' · ');
  // Periodische Dezimalzahl: h.per('0', '1', '6') -> 0,16̅ (Periode 6)
  h.per = (ip, pre, rep) => '<span data-t="' + ip + ',' + pre + '(' + rep + ') periodisch">' + ip + ',' + pre + '<span class="ov">' + rep + '</span></span>';
  h.set = (arr) => '{' + arr.join(', ') + '}';
  h.T = (n) => 'T<sub>' + n + '</sub>';
  h.V = (n) => 'V<sub>' + n + '</sub>';
  h.b = (s) => '<b>' + s + '</b>';

  h.table = (head, rows, cls) => {
    let s = '<table class="tb' + (cls ? ' ' + cls : '') + '">';
    if (head) s += '<tr>' + head.map((c) => '<th>' + c + '</th>').join('') + '</tr>';
    rows.forEach((r) => { s += '<tr>' + r.map((c) => '<td>' + c + '</td>').join('') + '</tr>'; });
    return s + '</table>';
  };

  // Auswahlaufgabe: richtige Antwort + falsche -> {choices, answer} (gemischt, Doppelte entfernt)
  h.mc = (right, wrongs, keepOrder) => {
    const key = (s) => String(s).replace(/<[^>]+>/g, '').replace(/\s+/g, '');
    const seen = new Set([key(right)]), w = [];
    wrongs.forEach((x) => { const k = key(x); if (!seen.has(k)) { seen.add(k); w.push(x); } });
    const all = keepOrder ? [right].concat(w) : h.shuffle([right].concat(w));
    return { choices: all, answer: all.indexOf(right) };
  };
  // Ordnen: items (HTML) + Werte -> {items, answer} (answer = Indizes in aufsteigender Reihenfolge)
  h.order = (items, values, desc) => {
    const idx = h.shuffle(h.range(0, items.length - 1));
    const its = idx.map((i) => items[i]), vals = idx.map((i) => values[i]);
    const answer = h.range(0, its.length - 1).sort((a, b) => (desc ? vals[b] - vals[a] : vals[a] - vals[b]));
    return { items: its, answer: answer, sep: desc ? '&gt;' : '&lt;' };
  };

  /* ---------------- SVG-Figuren ----------------
     Farben über CSS-Variablen, damit Hell/Dunkel stimmt. */
  const S = (w, hh, body, cls) => '<svg class="fig' + (cls ? ' ' + cls : '') + '" viewBox="0 0 ' + w + ' ' + hh + '" width="' + w + '" height="' + hh + '" xmlns="http://www.w3.org/2000/svg">' + body + '</svg>';
  h.svg = S;
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  // Kreis in d gleiche Teile, shaded = Anzahl (ab oben) oder Array von Indizes
  h.svgPie = (d, shaded, opt) => {
    opt = opt || {};
    const r = opt.r || 52, cx = r + 4, cy = r + 4, set = new Set(Array.isArray(shaded) ? shaded : h.range(0, shaded - 1));
    let body = '';
    if (d === 1) {
      body = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" class="' + (set.has(0) ? 'sh' : 'un') + '"/>';
    } else {
      for (let i = 0; i < d; i++) {
        const a0 = -Math.PI / 2 + (2 * Math.PI * i) / d, a1 = -Math.PI / 2 + (2 * Math.PI * (i + 1)) / d;
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const large = a1 - a0 > Math.PI ? 1 : 0;
        body += '<path d="M' + cx + ' ' + cy + ' L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z" class="' + (set.has(i) ? 'sh' : 'un') + '"/>';
      }
    }
    return S(2 * r + 8, 2 * r + 8, body);
  };
  // Rechteckstreifen in d Teile
  h.svgStrip = (d, shaded, opt) => {
    opt = opt || {};
    const W = opt.w || 260, H = opt.h || 40, set = new Set(Array.isArray(shaded) ? shaded : h.range(0, shaded - 1));
    let body = '';
    for (let i = 0; i < d; i++) body += '<rect x="' + (4 + (i * W) / d).toFixed(2) + '" y="4" width="' + (W / d).toFixed(2) + '" height="' + H + '" class="' + (set.has(i) ? 'sh' : 'un') + '"/>';
    return S(W + 8, H + 8, body);
  };
  // Rechteck aus rows×cols Kästchen; cells = Anzahl (zufällig verteilt) oder Array von Indizes
  h.svgGrid = (rows, cols, cells, opt) => {
    opt = opt || {};
    const c = opt.cell || 26;
    const set = new Set(Array.isArray(cells) ? cells : h.sample(h.range(0, rows * cols - 1), cells));
    let body = '';
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
      const k = i * cols + j;
      body += '<rect x="' + (4 + j * c) + '" y="' + (4 + i * c) + '" width="' + c + '" height="' + c + '" class="' + (set.has(k) ? 'sh' : 'un') + '"/>';
    }
    return S(cols * c + 8, rows * c + 8, body);
  };

  // Zahlenstrahl. opt: {min, max, sub (Teilstriche je Einheit), labels:'units'|'ends'|'none'|[{v,t}],
  //  marks:[{v, t, cls}], arrowAt?}  Geometrie: x0=18, x1=W-18
  h.LINE = { W: 320, H: 78, x0: 20, x1: 300, y: 40 };
  h.lineX = (v, min, max) => h.LINE.x0 + ((v - min) / (max - min)) * (h.LINE.x1 - h.LINE.x0);
  h.svgLine = (opt) => {
    const L = h.LINE, min = opt.min, max = opt.max, sub = opt.sub || 1;
    let body = '<line x1="' + (L.x0 - 8) + '" y1="' + L.y + '" x2="' + (L.x1 + 12) + '" y2="' + L.y + '" class="ax"/>' +
      '<path d="M' + (L.x1 + 12) + ' ' + L.y + ' l-7 -4 v8 z" class="axh"/>';
    const n = Math.round((max - min) * sub);
    if (!opt.noTicks) for (let i = 0; i <= n; i++) {
      const v = min + i / sub, x = h.lineX(v, min, max), big = i % sub === 0;
      body += '<line x1="' + x.toFixed(2) + '" y1="' + (L.y - (big ? 9 : 5)) + '" x2="' + x.toFixed(2) + '" y2="' + (L.y + (big ? 9 : 5)) + '" class="tk' + (big ? ' big' : '') + '"/>';
    }
    let labels = opt.labels || 'units';
    if (labels === 'units') labels = h.range(min, max).map((v) => ({ v: v, t: h.num(v) }));
    else if (labels === 'ends') labels = [{ v: min, t: h.num(min) }, { v: max, t: h.num(max) }];
    else if (labels === 'none') labels = [];
    labels.forEach((l) => {
      const x = h.lineX(l.v, min, max);
      if (opt.noTicks) body += '<line x1="' + x.toFixed(2) + '" y1="' + (L.y - 9) + '" x2="' + x.toFixed(2) + '" y2="' + (L.y + 9) + '" class="tk big"/>';
      body += '<text x="' + x.toFixed(2) + '" y="' + (L.y + 26) + '" class="lb">' + esc(l.t) + '</text>';
    });
    (opt.marks || []).forEach((m) => {
      const x = h.lineX(m.v, min, max);
      body += '<path d="M' + x.toFixed(2) + ' ' + (L.y - 12) + ' l-6 -12 h12 z" class="mk ' + (m.cls || '') + '"/>';
      if (m.t) body += '<text x="' + x.toFixed(2) + '" y="' + (L.y - 28) + '" class="lb mkl">' + esc(m.t) + '</text>';
    });
    return S(L.W, L.H, body, 'line');
  };

  // Säulendiagramm: {cats:[], vals:[], step, max, unit}
  h.svgBars = (opt) => {
    const cats = opt.cats, vals = opt.vals, n = cats.length;
    const maxV = opt.max || Math.max.apply(null, vals), step = opt.step || 1;
    const top = Math.ceil(maxV / step) * step;
    const W = 320, H = 200, left = 34, bottom = 30, ch = H - bottom - 12, cw = W - left - 8;
    let body = '';
    for (let v = 0; v <= top + 1e-9; v += step) {
      const y = 12 + ch - (v / top) * ch;
      body += '<line x1="' + left + '" y1="' + y.toFixed(1) + '" x2="' + (W - 6) + '" y2="' + y.toFixed(1) + '" class="gl"/>' +
        '<text x="' + (left - 5) + '" y="' + (y + 4).toFixed(1) + '" class="lb sm" text-anchor="end">' + h.num(v) + '</text>';
    }
    const bw = (cw / n) * 0.62;
    cats.forEach((c, i) => {
      const x = left + (cw / n) * i + (cw / n - bw) / 2, bh = (vals[i] / top) * ch;
      body += '<rect x="' + x.toFixed(1) + '" y="' + (12 + ch - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" class="bar"/>' +
        '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 10) + '" class="lb sm">' + esc(c) + '</text>';
    });
    body += '<line x1="' + left + '" y1="' + (12 + ch) + '" x2="' + (W - 6) + '" y2="' + (12 + ch) + '" class="ax"/>';
    return S(W, H, body, 'chart');
  };

  // Kreisdiagramm: parts [{v, t}] – v sind Anteile (Summe egal)
  h.svgPieChart = (parts) => {
    const tot = parts.reduce((s, p) => s + p.v, 0), r = 70, cx = 80, cy = 80;
    let a = -Math.PI / 2, body = '', legend = '';
    parts.forEach((p, i) => {
      const a1 = a + (2 * Math.PI * p.v) / tot;
      const x0 = cx + r * Math.cos(a), y0 = cy + r * Math.sin(a), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const large = a1 - a > Math.PI ? 1 : 0;
      body += (parts.length === 1 ? '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" class="c' + i + '"/>' :
        '<path d="M' + cx + ' ' + cy + ' L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z" class="c' + i + '"/>');
      legend += '<rect x="176" y="' + (14 + i * 24) + '" width="14" height="14" rx="3" class="c' + i + '"/><text x="196" y="' + (26 + i * 24) + '" class="lb sm" text-anchor="start">' + esc(p.t) + '</text>';
      a = a1;
    });
    return S(320, Math.max(164, 24 * parts.length + 20), body + legend, 'chart pie');
  };

  /* Winkelfigur. Mathematische Drehrichtung (gegen den Uhrzeigersinn), Grad.
     opt: {deg, rot (Richtung des ersten Schenkels, Standard 0 = nach rechts), protractor: bool,
           label ('α'), arc: bool (Standard true), legs: [Name1, Name2] optional, vertex: 'S' optional} */
  h.ANG = { W: 320, H: 250, cx: 160, cy: 128, R: 112, P: 100 };
  h.angPt = (deg, r) => { const a = (deg * Math.PI) / 180; return [h.ANG.cx + r * Math.cos(a), h.ANG.cy - r * Math.sin(a)]; };
  // Winkelmesser am Schenkel mit Richtung rot; cw = Skala im Uhrzeigersinn (für überstumpfe Winkel)
  h.protractorSVG = (rot, cw) => {
    const A = h.ANG, P = A.P, dir = cw ? -1 : 1;
    const p0 = h.angPt(rot, P), p1 = h.angPt(rot + dir * 180, P);
    let s = '<path d="M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + ' A' + P + ' ' + P + ' 0 0 ' + (cw ? 1 : 0) + ' ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' Z" class="prot"/>';
    for (let g = 0; g <= 180; g++) {
      const len = g % 10 === 0 ? 12 : g % 5 === 0 ? 8 : 4;
      const a = h.angPt(rot + dir * g, P), b = h.angPt(rot + dir * g, P - len);
      s += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" class="ptk"/>';
      if (g % 10 === 0) { const t = h.angPt(rot + dir * g, P - 21); s += '<text x="' + t[0].toFixed(1) + '" y="' + (t[1] + 3).toFixed(1) + '" class="plb">' + g + '</text>'; }
    }
    s += '<circle cx="' + A.cx + '" cy="' + A.cy + '" r="2.5" class="pc"/>';
    return s;
  };
  h.svgAngle = (opt) => {
    const A = h.ANG, rot = opt.rot || 0, deg = opt.deg, R = A.R;
    let body = '';
    if (opt.protractor) body += h.protractorSVG(deg > 180 ? rot + deg : rot);
    if (opt.arc !== false) {
      const r = deg > 180 ? 24 : 30, a0 = h.angPt(rot, r), a1 = h.angPt(rot + deg, r);
      if (Math.abs(deg - 90) < 1e-9) {
        const q1 = h.angPt(rot, 18), q2 = h.angPt(rot + 45, 18 * Math.SQRT2), q3 = h.angPt(rot + 90, 18);
        body += '<path d="M' + q1[0].toFixed(1) + ' ' + q1[1].toFixed(1) + ' L' + q2[0].toFixed(1) + ' ' + q2[1].toFixed(1) + ' L' + q3[0].toFixed(1) + ' ' + q3[1].toFixed(1) + '" class="arc"/>' +
          '<circle cx="' + h.angPt(rot + 45, 9)[0].toFixed(1) + '" cy="' + h.angPt(rot + 45, 9)[1].toFixed(1) + '" r="2" class="pc"/>';
      } else if (deg >= 360) {
        body += '<circle cx="' + A.cx + '" cy="' + A.cy + '" r="' + r + '" class="arc"/>';
      } else {
        body += '<path d="M' + a0[0].toFixed(1) + ' ' + a0[1].toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + (deg > 180 ? 1 : 0) + ' 0 ' + a1[0].toFixed(1) + ' ' + a1[1].toFixed(1) + '" class="arc"/>';
      }
      if (opt.label !== '') { const l = h.angPt(rot + deg / 2, deg > 180 ? 40 : 46); body += '<text x="' + l[0].toFixed(1) + '" y="' + (l[1] + 5).toFixed(1) + '" class="alb">' + esc(opt.label || 'α') + '</text>'; }
    }
    const e0 = h.angPt(rot, R), e1 = h.angPt(rot + deg, R);
    body += '<line x1="' + A.cx + '" y1="' + A.cy + '" x2="' + e0[0].toFixed(1) + '" y2="' + e0[1].toFixed(1) + '" class="leg"/>' +
      '<line x1="' + A.cx + '" y1="' + A.cy + '" x2="' + e1[0].toFixed(1) + '" y2="' + e1[1].toFixed(1) + '" class="leg"/>' +
      '<circle cx="' + A.cx + '" cy="' + A.cy + '" r="3.5" class="vx"/>';
    if (opt.vertex) body += '<text x="' + (A.cx - 10) + '" y="' + (A.cy + 18) + '" class="lb">' + esc(opt.vertex) + '</text>';
    if (opt.legs) {
      const l0 = h.angPt(rot - 6, R - 8), l1 = h.angPt(rot + deg + 6, R - 8);
      body += '<text x="' + l0[0].toFixed(1) + '" y="' + (l0[1] + 5).toFixed(1) + '" class="lb">' + esc(opt.legs[0]) + '</text>' +
        '<text x="' + l1[0].toFixed(1) + '" y="' + (l1[1] + 5).toFixed(1) + '" class="lb">' + esc(opt.legs[1]) + '</text>';
    }
    return S(A.W, A.H, body, 'angle');
  };

  /* Karogitter-Figur (auch für Aufgaben vom Typ 'grid' benutzt).
     g: {w, h (Kästchen), shapes:[...]}; Kästchen 24 px, Rand 12 px.
     shapes: {kind:'poly', pts:[[x,y],..], closed:true, cls:'orig'|'img'|'aux'}
             {kind:'line', from:[x,y], to:[x,y], cls:'axis'|'aux'|'orig'}  (axis wird über den Rand verlängert)
             {kind:'pt', at:[x,y], label:'A', cls:'orig'|'img'|'center'}
             {kind:'arrow', from:[x,y], to:[x,y], cls:'vec'} */
  h.GRID = { c: 24, m: 12 };
  h.gx = (x) => h.GRID.m + x * h.GRID.c;
  h.gridShapes = (g) => {
    let s = '';
    (g.shapes || []).forEach((sh) => {
      const P = (p) => h.gx(p[0]).toFixed(1) + ' ' + h.gx(p[1]).toFixed(1);
      if (sh.kind === 'poly') s += '<path d="M' + sh.pts.map(P).join(' L') + (sh.closed !== false ? ' Z' : '') + '" class="gp ' + (sh.cls || 'orig') + '"/>';
      else if (sh.kind === 'line') {
        let a = sh.from, b = sh.to;
        if (sh.cls === 'axis') { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, k = (g.w + g.h) / L; a = [a[0] - dx * k, a[1] - dy * k]; b = [b[0] + dx * k, b[1] + dy * k]; }
        s += '<line x1="' + h.gx(a[0]).toFixed(1) + '" y1="' + h.gx(a[1]).toFixed(1) + '" x2="' + h.gx(b[0]).toFixed(1) + '" y2="' + h.gx(b[1]).toFixed(1) + '" class="gl2 ' + (sh.cls || 'aux') + '"/>';
      } else if (sh.kind === 'arrow') {
        const x1 = h.gx(sh.from[0]), y1 = h.gx(sh.from[1]), x2 = h.gx(sh.to[0]), y2 = h.gx(sh.to[1]);
        const ang = Math.atan2(y2 - y1, x2 - x1), hl = 10;
        s += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" class="gl2 vec"/>' +
          '<path d="M' + x2 + ' ' + y2 + ' L' + (x2 - hl * Math.cos(ang - 0.4)).toFixed(1) + ' ' + (y2 - hl * Math.sin(ang - 0.4)).toFixed(1) + ' L' + (x2 - hl * Math.cos(ang + 0.4)).toFixed(1) + ' ' + (y2 - hl * Math.sin(ang + 0.4)).toFixed(1) + ' Z" class="vech"/>';
      } else if (sh.kind === 'pt') {
        s += '<circle cx="' + h.gx(sh.at[0]) + '" cy="' + h.gx(sh.at[1]) + '" r="4.5" class="gpt ' + (sh.cls || 'orig') + '"/>';
        if (sh.label) s += '<text x="' + (h.gx(sh.at[0]) + 7) + '" y="' + (h.gx(sh.at[1]) - 7) + '" class="glb">' + esc(sh.label) + '</text>';
      }
    });
    return s;
  };
  h.gridBack = (w, hh) => {
    let s = '<rect x="' + h.GRID.m + '" y="' + h.GRID.m + '" width="' + w * h.GRID.c + '" height="' + hh * h.GRID.c + '" class="gbg"/>';
    for (let x = 0; x <= w; x++) s += '<line x1="' + h.gx(x) + '" y1="' + h.GRID.m + '" x2="' + h.gx(x) + '" y2="' + h.gx(hh) + '" class="gline"/>';
    for (let y = 0; y <= hh; y++) s += '<line x1="' + h.GRID.m + '" y1="' + h.gx(y) + '" x2="' + h.gx(w) + '" y2="' + h.gx(y) + '" class="gline"/>';
    return s;
  };
  let gcid = 0;
  h.svgGridFig = (g) => { const id = 'gc' + ++gcid; return '<svg class="fig grid" viewBox="0 0 ' + (g.w * h.GRID.c + 2 * h.GRID.m) + ' ' + (g.h * h.GRID.c + 2 * h.GRID.m) + '" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="' + id + '"><rect x="' + (h.GRID.m - 10) + '" y="' + (h.GRID.m - 10) + '" width="' + (g.w * h.GRID.c + 20) + '" height="' + (g.h * h.GRID.c + 20) + '"/></clipPath></defs>' + h.gridBack(g.w, g.h) + '<g clip-path="url(#' + id + ')">' + h.gridShapes(g) + '</g></svg>'; };

  /* ---------------- Antworten prüfen ---------------- */
  M6.TYPES = ['num', 'nums', 'frac', 'mc', 'multi', 'tf', 'order', 'factors', 'line', 'grid', 'angle'];

  /* ================= 1.2 Teilbarkeit von Summen ================= */
  const why = (x, t) => (x % t === 0 ? t + ' | ' + N(x) + ', denn ' + divTxt(x, t) : t + ' ∤ ' + N(x) + ', denn ' + divTxt(x, t));

  const ruleTxt = (n, t) => {

    while (r !== 0 && seen[r] === undefined) { seen[r] = digits.length; r *= 10; digits += Math.floor(r / d); r %= d; }
    if (r === 0) return { ip: String(ip), pre: digits, rep: '' };
    const k = seen[r];
    return { ip: String(ip), pre: digits.slice(0, k), rep: digits.slice(k) };
  };
  const perHTML = (p) => (p.rep ? h.per(p.ip, p.pre, p.rep) : p.ip + (p.pre ? ',' + p.pre : ''));
  const decHTML = (n, d) => perHTML(perDec(n, d));
  // Schriftliche Division n : d als Schritte (bis Rest 0 oder Wiederholung)
  const longDiv = (n, d) => {
    const lines = [];
    const ip = Math.floor(n / d); let r = n % d;
    lines.push(n + ' : ' + d + ' = ' + ip + ' Rest ' + r);
    const seen = {}; let i = 0;
    while (r !== 0 && i < 10) {
      if (seen[r]) { lines.push('Der Rest ' + r + ' kam schon einmal vor – ab hier wiederholen sich die Ziffern.'); break; }
      seen[r] = true;
      const z = r * 10, q = Math.floor(z / d), r2 = z % d;
      lines.push(z + ' : ' + d + ' = ' + q + ' Rest ' + r2 + (i === 0 ? ' &nbsp;(Komma setzen, Null anhängen)' : ''));
      r = r2; i++;
    }
    return lines.join('<br>');
  };
  // Bruchteil-Namen: tel(4) = 'Viertel', tel(2, n) = 'Halbe'/'Halbes'
  const TEL = { 2: 'Halbe', 3: 'Drittel', 4: 'Viertel', 5: 'Fünftel', 6: 'Sechstel', 7: 'Siebtel', 8: 'Achtel', 9: 'Neuntel', 10: 'Zehntel', 11: 'Elftel', 12: 'Zwölftel' };
  const tel = (d, n) => (d === 2 ? (n === 1 ? 'Halbes' : 'Halbe') : TEL[d] || d + '-tel');
  // Größen: groß, klein, Umrechnungszahl, erlaubte Nenner
  const UNITS = [
    { b: 'h', s: 'min', f: 60, sn: 'Minuten', ds: [2, 3, 4, 5, 6, 10, 12, 15, 20] },

<h3>Ein Ganzes in gleich große Teile</h3>

<p>Brüche beschreiben auch Anteile an einer Gruppe: Von 10 Kindern tragen 3 eine Brille. Das sind ${h.fr(3, 10)} der Gruppe.</p>

<p>Probiere es selbst aus: Verändere Zähler und Nenner.</p>

        gens: { 1: ['k5_dd_nat', ['k5_dd_dec', 1]], 2: [['k5_dd_nat', 2], 'k5_dd_dec', 'k5_dd_same'], 3: ['k5_dd_word', ['k5_dd_same', 3], ['k5_dd_dec', 3]] }

<div class="merk"><b>Merke</b><ol><li><b>Klammern</b> zuerst.</li><li>Dann <b>Punktrechnung</b> (· und :).</li><li>Dann <b>Strichrechnung</b> (+ und −).</li></ol>Bei gleichrangigen Rechnungen rechnest du <b>von links nach rechts</b>.</div>

<div class="bsp"><b>Beispiel</b> ${h.fr(3, 4)} · 2,4 + 0,6<br>${h.fr(3, 4)} von 2,4: 2,4 : 4 = 0,6 und 0,6 · 3 = 1,8<br>1,8 + 0,6 = <b>2,4</b></div>
<div class="tipp"><b>Tipp</b> Schreib jeden Zwischenschritt in eine neue Zeile und unterstreiche, was du als Nächstes ausrechnest. Häufigster Fehler: einfach von links nach rechts rechnen und dabei „Punkt vor Strich“ vergessen.</div>`,
        gens: { 1: ['k5_rg_dec', 'k5_rg_first'], 2: [['k5_rg_dec', 2], 'k5_rg_frac', 'k5_rg_mix'], 3: ['k5_rg_word', 'k5_rg_err', ['k5_rg_frac', 3]] }

      {
        id: '5.9', title: 'Ausmultiplizieren und Ausklammern',
        learn: (h) => `
<h3>Das Distributivgesetz</h3>
<p>Du kaufst 3 Hefte zu 1,20 € und 3 Stifte zu 0,80 €. Du kannst jede Sorte einzeln bezahlen: 3 · 1,20 € + 3 · 0,80 € = 3,60 € + 2,40 € = 6 €. Oder du rechnest 3 Pakete „Heft + Stift“: 3 · (1,20 € + 0,80 €) = 3 · 2 € = 6 €. Beides ergibt dasselbe.</p>
<div class="merk"><b>Merke</b> <b>Distributivgesetz (Verteilungsgesetz)</b><br>a · (b + c) = a · b + a · c &nbsp;&nbsp; a · (b − c) = a · b − a · c<br>Von links nach rechts heißt das <b>Ausmultiplizieren</b>, von rechts nach links <b>Ausklammern</b>.</div>
<h3>Vorteilhaft rechnen</h3>
<div class="bsp"><b>Ausklammern</b> 17 · 23 + 17 · 77 = 17 · (23 + 77) = 17 · 100 = <b>1700</b></div>
<div class="bsp"><b>Ausmultiplizieren</b> 6 · 102 = 6 · (100 + 2) = 600 + 12 = <b>612</b><br>8 · 99 = 8 · (100 − 1) = 800 − 8 = <b>792</b></div>
<div class="bsp"><b>Mit Brüchen</b> 12 · (${h.fr(1, 3)} + ${h.fr(1, 4)}) = 12 · ${h.fr(1, 3)} + 12 · ${h.fr(1, 4)} = 4 + 3 = <b>7</b><br>${h.fr(2, 5)} · 7 + ${h.fr(2, 5)} · 3 = ${h.fr(2, 5)} · (7 + 3) = ${h.fr(2, 5)} · 10 = <b>4</b></div>
<div class="tipp"><b>Tipp</b> Beim Ausmultiplizieren musst du <b>jeden</b> Summanden in der Klammer malnehmen: 5 · (20 + 4) = 100 + 20, nicht 100 + 4. Beim Ausklammern suchst du den gemeinsamen Faktor, der in beiden Produkten vorkommt.</div>`,
        gens: { 1: ['k5_dg_expand', 'k5_dg_factor'], 2: ['k5_dg_frac', 'k5_dg_mc', ['k5_dg_factor', 2], ['k5_dg_expand', 2]], 3: ['k5_dg_gap', 'k5_dg_word', ['k5_dg_mc', 3]] }
      },
      {
        id: '5.10', title: 'Vermischte Aufgaben', mixed: true,
        learn: (h) => `
<h3>Überblick</h3>

<ul>

<li><b>Rechenregeln:</b> Klammer vor Punkt vor Strich.</li>
</ul>
<div class="tipp"><b>Tipp</b> Mach bei Dezimalzahlen immer einen Überschlag und bei Divisionen die Probe mit der Umkehrrechnung.</div>`,
        gens: {
          1: ['k5_fn_mul', 'k5_ff_mul', 'k5_ffd_basic', 'k5_kv_basic', 'k5_dm_small', 'k5_dd_nat'],
          2: ['k5_ff_cancel', 'k5_ff_mixed', 'k5_fdn_mixed', 'k5_ffd_mixed', 'k5_dm_dec', 'k5_dd_dec', 'k5_rg_frac', 'k5_dg_factor'],
          3: ['k5_fn_word', 'k5_ff_word', 'k5_ffd_word', 'k5_kv_word', 'k5_dm_word', 'k5_dd_word', 'k5_rg_word', 'k5_dg_word', 'k5_mx_check']

    ],
    summary: (h) => `
<div class="merk"><b>Bruch · natürliche Zahl</b> Zähler mal Zahl, Nenner bleibt: ${h.fr(2, 7)} · 3 = ${h.fr(6, 7)}. Vorher kürzen, wenn möglich.</div>

<div class="merk"><b>Bruch : Bruch</b> Mit dem Kehrwert multiplizieren: ${h.fr(3, 4)} : ${h.fr(2, 5)} = ${h.fr(3, 4)} · ${h.fr(5, 2)} = ${h.fr(15, 8)}.</div>
<div class="merk"><b>Kommaverschiebung</b> · 10 / 100 / 1000: Komma 1 / 2 / 3 Stellen nach rechts; : 10 / 100 / 1000: nach links.</div>
<div class="merk"><b>Dezimalzahlen multiplizieren</b> Ohne Komma rechnen; das Ergebnis hat so viele Nachkommastellen wie beide Faktoren zusammen. Überschlag machen!</div>
<div class="merk"><b>Dezimalzahlen dividieren</b> Durch eine natürliche Zahl: beim Überschreiten des Kommas Komma setzen. Durch eine Dezimalzahl: Komma bei beiden Zahlen gleich weit nach rechts verschieben.</div>
<div class="merk"><b>Rechenregeln</b> Klammer vor Punkt vor Strich, sonst von links nach rechts.</div>
<div class="merk"><b>Distributivgesetz</b> a · (b + c) = a · b + a · c (ausmultiplizieren ↔ ausklammern). Beispiel: 17 · 23 + 17 · 77 = 17 · 100 = 1700.</div>`
  });

  /* ---------- Rechenweg-Helfer für Brüche ---------- */
  // Produkt a · b (Bruch-Objekte, gekürzt) mit Kürzen über Kreuz. dA/dB = Anzeige der Faktoren.
  // Liefert {res, html} – html beginnt mit „dA · dB = …“
  function mulSteps(a, b, dA, dB) {
    const res = h.fmul(a, b);
    const den = (x, y) => [x, y].filter((d) => d !== 1);
    const numS = a.n + ' · ' + b.n, denA = den(a.d, b.d);
    let s = dA + ' · ' + dB + ' = ' + (denA.length ? fx(numS, denA.join(' · ')) : numS);
    if (!denA.length) return { res: res, html: dA + ' · ' + dB + ' = ' + h.b(N(res.n)) };
    const g1 = h.gcd(a.n, b.d), g2 = h.gcd(b.n, a.d);
    if (g1 > 1 || g2 > 1) {
      const c = [];
      if (g1 > 1) c.push('Kürze ' + a.n + ' und ' + b.d + ' durch ' + g1);
      if (g2 > 1) c.push('kürze ' + b.n + ' und ' + a.d + ' durch ' + g2);
      const an = a.n / g1, bn = b.n / g2, ad = a.d / g2, bd = b.d / g1;
      const dd = [];
      if (a.d !== 1) dd.push(ad);
      if (b.d !== 1) dd.push(bd);
      const top = an + ' · ' + bn, bot = dd.join(' · ');
      const prodD = dd.reduce((p, x) => p * x, 1);
      const cs = c.join(', ');
      s += '<br>' + cs.charAt(0).toUpperCase() + cs.slice(1) + ':<br>' + (prodD === 1 && dd.length <= 1 ? top : fx(top, bot)) + ' = ' + endF(res);
    } else {
      const raw = { n: a.n * b.n, d: a.d * b.d };
      if (raw.d === res.d) s += ' = ' + endF(res);
      else s += ' = ' + h.fr(raw.n, raw.d) + ' = ' + endF(res);
    }
    return { res: res, html: s };
  }
  // a : n (n natürlich)
  function divNSteps(a, n, dA) {
    const res = h.fdiv(a, F(n, 1));
    let s = dA + ' : ' + n + ' = ' + fx(a.n, a.d + ' · ' + n);
    const g = h.gcd(a.n, n);
    if (g > 1) {
      const nn = n / g;
      s += '<br>Kürze ' + a.n + ' und ' + n + ' durch ' + g + ':<br>' + (nn === 1 ? endF(res) : fx(a.n / g, a.d + ' · ' + nn) + ' = ' + endF(res));
    } else s += ' = ' + endF(res);
    return { res: res, html: s };
  }
  // a : b (Brüche) über den Kehrwert
  function divSteps(a, b, dA, dB) {
    const kb = F(b.d, b.n);
    const m = mulSteps(a, kb, dA, fS(kb));
    return { res: m.res, html: dA + ' : ' + dB + ' = ' + m.html + '' };
  }
  const mixToImp = (w, n, d) => mxHTML(w, n, d) + ' = ' + h.fr(w * d + n, d);
  // zufällige gemischte Zahl {w,n,d,f}
  const rMix = (wMax, dens) => { const p = properF(dens || [2, 3, 4, 5, 6, 8]); const w = h.rnd(1, wMax || 3); return { w: w, n: p.n, d: p.d, f: mx(w, p.n, p.d), html: mxHTML(w, p.n, p.d) }; };

  /* ---------- Aufwärmen ---------- */
  G('k5_w_kuerzen', (h) => {
    const b = properF([3, 4, 5, 6, 7, 8, 9, 10]), k = h.rnd(2, 6);
    const n = b.n * k, d = b.d * k;
    return fracT(`Kürze ${h.fr(n, d)} vollständig.`, b,
      `ggT(${n}, ${d}) = ${k}<br>${h.fr(n, d)} = ${fx(n + ' : ' + k, d + ' : ' + k)} = ${h.b(h.fr(b.n, b.d))}`,
      'Suche die größte Zahl, durch die Zähler und Nenner teilbar sind.');
  });
  G('k5_w_umwandeln', (h) => {
    const m = rMix(4);
    if (h.chance(0.5)) {
      return { type: 'frac', q: `Schreibe ${m.html} als unechten Bruch.`, answer: { n: m.f.n, d: m.f.d }, form: 'improper',
        sol: `${m.w} Ganze sind ${m.w} · ${m.d} = ${m.w * m.d} ${m.d === 2 ? 'Halbe' : 'Teile'}, dazu kommen ${m.n}.<br>${m.html} = ${fx(m.w + ' · ' + m.d + ' + ' + m.n, m.d)} = ${h.b(h.fr(m.f.n, m.f.d))}`,
        hint: 'Ganze mal Nenner, dann den Zähler dazuzählen.' };
    }
    return { type: 'frac', q: `Schreibe ${h.fr(m.f.n, m.f.d)} als gemischte Zahl.`, answer: { w: m.w, n: m.n, d: m.d }, form: 'mixed', whole: true,
      sol: `${m.f.n} : ${m.d} = ${m.w} Rest ${m.n}<br>${h.fr(m.f.n, m.f.d)} = ${h.b(m.html)}`, hint: 'Wie oft passt der Nenner in den Zähler? Der Rest bleibt als Bruch.' };
  });

    const list = [[1, 2, 0.5], [1, 4, 0.25], [3, 4, 0.75], [1, 5, 0.2], [2, 5, 0.4], [3, 5, 0.6], [4, 5, 0.8], [1, 10, 0.1], [3, 10, 0.3], [7, 10, 0.7], [9, 10, 0.9], [1, 8, 0.125], [3, 8, 0.375], [1, 20, 0.05], [7, 20, 0.35], [3, 25, 0.12]];
    const [n, d, v] = h.pick(list);
    const D = [10, 100, 1000].find((x) => x % d === 0), k = D / d;
    return { type: 'num', q: `Schreibe ${h.fr(n, d)} als Dezimalzahl.`, answer: v,
      sol: `Erweitere auf ${N(D)}: ${h.fr(n, d)} = ${h.fr(n * k, D)} = ${h.b(N(v))}`, hint: 'Erweitere auf den Nenner 10, 100 oder 1000.' };
  });

  /* ---------- 5.1 Bruch · natürliche Zahl ---------- */
  G('k5_fn_mul', (h, o) => {
    let a, n;
    do {
      a = properF(o.lvl === 1 ? [3, 4, 5, 7, 8, 9, 10, 11] : [3, 4, 5, 6, 7, 8, 9, 10, 12]);
      n = h.rnd(2, o.lvl === 1 ? 5 : 9);
    } while ((o.lvl === 1 && h.gcd(n, a.d) > 1) || (o.lvl === 1 && a.n * n > 3 * a.d) || (o.lvl === 2 && a.n * n <= a.d));
    const asMixed = o.lvl >= 2;
    const left = h.chance(0.5);
    const dq = left ? `${n} · ${h.fr(a.n, a.d)}` : `${h.fr(a.n, a.d)} · ${n}`;

  G('k5_fdn_rev', (h) => {

  /* ---------- 5.5 Kommaverschiebung ---------- */

  /* ---------- 5.6 Dezimalzahlen multiplizieren ---------- */
  const dmSol = (a, b) => {

      const p0 = [h.rnd(0, W), h.rnd(0, H)];
      let pts = [p0];
      for (let i = 1; i < n; i++) pts.push([p0[0] + h.rnd(-sp, sp), p0[1] + h.rnd(-sp, sp)]);
      if (!pts.every((p) => insideL(p, W, H))) continue;
      if (new Set(pts.map(key)).size < n) continue;
      if (kind === 'seg') { const dx = pts[1][0] - pts[0][0], dy = pts[1][1] - pts[0][1]; if (dx * dx + dy * dy < 5) continue; }
      if (kind === 'tri') { if (area2(pts) < 6) continue; if ([0, 1, 2].some((i) => { const a = pts[i], b = pts[(i + 1) % 3]; return (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 < 4; })) continue; }
      if (kind === 'quad') { const hu = hull(pts); if (hu.length !== 4 || area2(hu) < 12) continue; pts = hu; if (h.chance(0.5)) pts.reverse(); const r = h.rnd(0, 3); pts = pts.slice(r).concat(pts.slice(0, r)); }
      const img = pts.map(f);
      if (!img.every((p) => insideL(p, W, H))) continue;
      if (ok && !ok(pts, img)) continue;
      return { pts: pts, img: img };
    }
    throw new Error('randFig: keine passende Figur gefunden (' + kind + ')');
  }
  // Generator mit Wiederholung: Findet randFig bei ungünstig gewürfelten Parametern nichts, wird neu gewürfelt.
  const genR = (id, fn) => M6.gen(id, (h, o) => {
    for (let i = 0; i < 60; i++) { try { return fn(h, o); } catch (e) { if (!/randFig/.test(e.message)) throw e; } }
    return fn(h, o);
  });
  // Umgebende Rechtecke von Original und Bild überschneiden sich nicht (übersichtlicher bei Verschiebungen)
  const apart = (pts, img) => {
    const bb = (P) => [Math.min(...P.map((p) => p[0])), Math.max(...P.map((p) => p[0])), Math.min(...P.map((p) => p[1])), Math.max(...P.map((p) => p[1]))];
    const a = bb(pts), b = bb(img);
    return a[1] < b[0] || b[1] < a[0] || a[3] < b[2] || b[3] < a[2];
  };
  const disjoint = (pts, img) => { const s = new Set(pts.map(key)); return img.every((p) => !s.has(key(p))); };
  const figShapes = (pts, lab, cls) => {
    const s = [];
    if (pts.length === 2) s.push({ kind: 'poly', pts: pts, closed: false, cls: cls || 'orig' });
    if (pts.length > 2) s.push({ kind: 'poly', pts: pts, cls: cls || 'orig' });
    pts.forEach((p, i) => s.push({ kind: 'pt', at: p, label: lab[i], cls: cls || 'orig' }));
    return s;
  };
  const figWord = (n) => (n === 1 ? 'den Punkt A' : n === 2 ? 'die Strecke AB' : n === 3 ? 'das Dreieck ABC' : 'das Viereck ABCD');
  const imgWord = (n, pr) => ABC.slice(0, n).map((c) => c + pr).join(', ').replace(/, ([^,]*)$/, ' und $1');
  const gridTask = (W, H, shapes, img, pr, q, sol, hint) => ({
    type: 'grid', w: W, h: H, shapes: shapes, targets: img.map((p) => ({ x: p[0], y: p[1] })),
    names: img.map((_, i) => ABC[i] + pr), connect: img.length > 1, q: q, sol: sol, hint: hint
  });
  // Lösungsfigur: Original + Bild (+ Hilfslinien)
  const solFig = (W, H, shapes, img, pr, extra) =>
    h.svgGridFig({ w: W, h: H, shapes: shapes.concat(extra || [], figShapes(img, img.map((_, i) => ABC[i] + pr), 'img')) });

  /* ---------- Figurenbibliothek (für Symmetrieachsen, Punkt- und Drehsymmetrie) ---------- */
  const reg = (n, R, start) => h.range(0, n - 1).map((k) => { const a = ((start + (360 * k) / n) * Math.PI) / 180; return [R * Math.cos(a), -R * Math.sin(a)]; });
  const SHP = {
    quadrat: { name: 'Quadrat', art: 'das', pts: [[-40, -40], [40, -40], [40, 40], [-40, 40]], axes: [0, 45, 90, 135], ps: true, rot: 90 },

    glsdreieck: { name: 'gleichschenklige Dreieck', nom: 'gleichschenkliges Dreieck', art: 'das', pts: [[0, -50], [32, 45], [-32, 45]], axes: [90], ps: false, rot: 0 },
    dreieck: { name: 'unregelmäßige Dreieck', nom: 'unregelmäßiges Dreieck', art: 'das', pts: [[-52, 40], [44, 40], [-14, -45]], axes: [], ps: false, rot: 0 },
    fuenfeck: { name: 'regelmäßige Fünfeck', nom: 'regelmäßiges Fünfeck', art: 'das', pts: reg(5, 54, 90).map((p) => [p[0], p[1] + 5]), cy: 5, axes: [90, 162, 54, 126, 18], ps: false, rot: 72 },
    sechseck: { name: 'regelmäßige Sechseck', nom: 'regelmäßiges Sechseck', art: 'das', pts: reg(6, 54, 0), axes: [0, 30, 60, 90, 120, 150], ps: true, rot: 60 },
    raute: { name: 'Raute', art: 'die', pts: [[0, -52], [34, 0], [0, 52], [-34, 0]], axes: [0, 90], ps: true, rot: 180 },

  };
  const nomOf = (s) => s.nom || s.name;
  const artNom = (s) => ({ das: 'ein', die: 'eine', der: 'ein' }[s.art]); // ein Quadrat, eine Raute, ein Kreis
  const shapeSVG = (s, opt) => {
    opt = opt || {};
    const cx = 80, cy = 66, P = (p) => (cx + p[0]).toFixed(1) + ' ' + (cy + p[1]).toFixed(1);
    let b = s.circle ? '<circle cx="' + cx + '" cy="' + cy + '" r="' + s.circle + '" class="sh"/>' : '<path d="M' + s.pts.map(P).join(' L') + ' Z" class="sh"/>';
    const oy = cy + (s.cy || 0); // Mittelpunkt der Figur
    if (opt.axes) {
      const list = s.axes === 'inf' ? [0, 30, 60, 90, 120, 150] : s.axes;
      list.forEach((a) => {
        const r = (a * Math.PI) / 180, L = 64, dx = L * Math.cos(r), dy = -L * Math.sin(r);
        b += '<line x1="' + (cx - dx).toFixed(1) + '" y1="' + (oy - dy).toFixed(1) + '" x2="' + (cx + dx).toFixed(1) + '" y2="' + (oy + dy).toFixed(1) + '" class="aux"/>';
      });
    }
    if (opt.center) b += '<circle cx="' + cx + '" cy="' + oy + '" r="3.5" class="ln"/>';

  };

  /* ---------- Buchstaben als Strichfiguren (Kasten 4 × 6), Symmetrie wird nachgerechnet ---------- */
  const LET = {
    A: [[[0, 6], [2, 0], [4, 6]], [[1, 3], [3, 3]]],
    B: [[[0, 0], [0, 6]], [[0, 0], [3, 0], [4, 1], [4, 2], [3, 3], [0, 3]], [[3, 3], [4, 4], [4, 5], [3, 6], [0, 6]]],

    L: [[[0, 0], [0, 6], [4, 6]]],
    M: [[[0, 6], [0, 0], [2, 3], [4, 0], [4, 6]]],

    O: [[[1, 0], [3, 0], [4, 1], [4, 5], [3, 6], [1, 6], [0, 5], [0, 1], [1, 0]]],
    P: [[[0, 6], [0, 0], [3, 0], [4, 1], [4, 2], [3, 3], [0, 3]]],
    R: [[[0, 6], [0, 0], [3, 0], [4, 1], [4, 2], [3, 3], [0, 3]], [[2, 3], [4, 6]]],
    S: [[[4, 1], [3, 0], [1, 0], [0, 1], [0, 2], [1, 3], [3, 3], [4, 4], [4, 5], [3, 6], [1, 6], [0, 5]]],
    T: [[[0, 0], [4, 0]], [[2, 0], [2, 6]]],
    U: [[[0, 0], [0, 5], [1, 6], [3, 6], [4, 5], [4, 0]]],
    V: [[[0, 0], [2, 6], [4, 0]]],
    W: [[[0, 0], [1, 6], [2, 2], [3, 6], [4, 0]]],
    X: [[[0, 0], [4, 6]], [[4, 0], [0, 6]]],
    Y: [[[0, 0], [2, 3], [4, 0]], [[2, 3], [2, 6]]],
    Z: [[[0, 0], [4, 0], [0, 6], [4, 6]]]
  };
  const segSet = (lines, f) => {
    const s = new Set();
    lines.forEach((pl) => { for (let i = 0; i + 1 < pl.length; i++) { const a = f(pl[i]), b = f(pl[i + 1]); const k1 = key(a), k2 = key(b); s.add(k1 < k2 ? k1 + '|' + k2 : k2 + '|' + k1); } });
    return s;
  };
  const sameSet = (a, b) => a.size === b.size && [...a].every((x) => b.has(x));
  const LSYM = {};
  Object.keys(LET).forEach((c) => {
    const id = segSet(LET[c], (p) => p);
    LSYM[c] = {
      v: sameSet(id, segSet(LET[c], (p) => [4 - p[0], p[1]])),
      hz: sameSet(id, segSet(LET[c], (p) => [p[0], 6 - p[1]])),
      p: sameSet(id, segSet(LET[c], (p) => [4 - p[0], 6 - p[1]]))
    };
    LSYM[c].ax = LSYM[c].v || LSYM[c].hz;
  });
  const letterSVG = (c, opt) => {
    opt = opt || {};
    const u = opt.u || 11, m = 12, X = (x) => (m + x * u).toFixed(1), Y = (y) => (m + y * u).toFixed(1);
    let b = '<title>' + c + '</title>';
    LET[c].forEach((pl) => { b += '<path d="M' + pl.map((p) => X(p[0]) + ' ' + Y(p[1])).join(' L') + '" class="ln" style="stroke-width:' + (u / 2.2).toFixed(1) + ';stroke-linecap:round;stroke-linejoin:round;fill:none"/>'; });
    if (opt.axes) {
      if (LSYM[c].v) b += '<line x1="' + X(2) + '" y1="' + Y(-0.9) + '" x2="' + X(2) + '" y2="' + Y(6.9) + '" class="aux"/>';
      if (LSYM[c].hz) b += '<line x1="' + X(-0.9) + '" y1="' + Y(3) + '" x2="' + X(4.9) + '" y2="' + Y(3) + '" class="aux"/>';
      if (LSYM[c].p) b += '<circle cx="' + X(2) + '" cy="' + Y(3) + '" r="3.5" class="sh"/>';
    }
    return h.svg(2 * m + 4 * u, 2 * m + 6 * u, b);
  };
  const symTxt = (c) => {
    const s = LSYM[c], p = [];
    if (s.v) p.push('eine senkrechte Symmetrieachse');
    if (s.hz) p.push('eine waagerechte Symmetrieachse');
    let t = p.length ? c + ' hat ' + p.join(' und ') : c + ' hat keine Symmetrieachse';
    t += s.p ? ' und ist punktsymmetrisch.' : (p.length ? ', ist aber nicht punktsymmetrisch.' : ' und ist auch nicht punktsymmetrisch.');
    return t;
  };

  /* ---------- Gitter-Vielecke für „Ist die Figur symmetrisch?“ ---------- */
  // Kollineare Zwischenpunkte entfernen
  const clean = (pts) => pts.filter((p, i) => cross(pts[(i + pts.length - 1) % pts.length], p, pts[(i + 1) % pts.length]) !== 0);
  const setSym = (pts, f) => { const s = new Set(pts.map(key)); return pts.every((p) => s.has(key(f(p)))); };

  /* =========================================================
     Kapitel
     ========================================================= */
  M6.chapter({
    id: 'k6', nr: 6,
    title: 'Symmetrie und Abbildung',
    sub: 'Spiegeln, Drehen, Verschieben',
    color: '#0891b2',
    intro: 'Du lernst, wann Figuren symmetrisch sind und wie du Figuren auf dem Karopapier spiegelst, drehst und verschiebst.',
    warmup: ['k6_buchst', 'k6_achsen_anz'],
    lessons: [
      {
        id: '6.1', title: 'Achsensymmetrie und Achsenspiegelung',
        learn: (h) => `
<p>Faltest du ein Blatt mit einem Klecks in der Mitte, entsteht ein Bild, dessen beide Hälften genau aufeinanderpassen.
So eine Figur heißt <b>achsensymmetrisch</b>. Die Faltlinie ist die <b>Symmetrieachse</b>.</p>
<div class="merk"><b>Merke</b> Eine Figur ist <b>achsensymmetrisch</b>, wenn man sie so an einer Geraden falten kann,
dass beide Hälften genau aufeinanderliegen. Manche Figuren haben mehrere Symmetrieachsen (ein Quadrat hat 4, ein Kreis unendlich viele).</div>
<h3>An einer Achse spiegeln</h3>
${h.svgGridFig({ w: 10, h: 6, shapes: [{ kind: 'line', from: [5, 0], to: [5, 6], cls: 'axis' },
  { kind: 'line', from: [2, 1], to: [8, 1], cls: 'aux' }, { kind: 'line', from: [1, 5], to: [9, 5], cls: 'aux' }, { kind: 'line', from: [4, 3], to: [6, 3], cls: 'aux' }]
  .concat(figShapes([[2, 1], [1, 5], [4, 3]], ['A', 'B', 'C']), figShapes([[8, 1], [9, 5], [6, 3]], ["A'", "B'", "C'"], 'img')) })}
<div class="merk"><b>Merke</b> Bei der <b>Achsenspiegelung</b> an einer Achse g gilt für jeden Punkt P und seinen Bildpunkt P':
<ul><li>Die Strecke PP' steht <b>senkrecht</b> auf g.</li>
<li>P und P' sind <b>gleich weit</b> von g entfernt – die Achse halbiert die Strecke PP'.</li>

<div class="bsp"><b>Beispiel</b> Oben liegt A 3 Kästchen links von der Achse. Also liegt A' in derselben Zeile 3 Kästchen rechts von der Achse.

<div class="tipp"><b>Tipp</b> Bei einer schrägen Achse (45°) gehst du von jedem Punkt schräg durch die Kästchenecken auf die Achse zu – senkrecht zur Achse – und dann gleich weit weiter.</div>`,
        gens: { 1: ['k6_achs_grid', 'k6_achsen_anz', 'k6_buchst'], 2: ['k6_achs_grid', 'k6_achsen_anz', 'k6_buchst', 'k6_ist_achs'], 3: ['k6_achs_grid', 'k6_achsen_anz', 'k6_ist_achs', ['k6_eig', 3]] }

      {

<h3>An einem Punkt spiegeln</h3>

  .concat(figShapes([[1, 1], [3, 4], [2, 5]], ['A', 'B', 'C']), figShapes([[7, 5], [5, 2], [6, 1]], ["A'", "B'", "C'"], 'img'), [{ kind: 'pt', at: [4, 3], label: 'Z', cls: 'center' }]) })}

<p>Eine Punktspiegelung ist dasselbe wie eine Drehung um 180°. Deshalb bleibt der <b>Umlaufsinn erhalten</b>.

<div class="tipp"><b>Tipp</b> Dreh dein Heft einmal auf den Kopf: Sieht die Figur genauso aus, ist sie punktsymmetrisch.</div>`,

      },
      {

        learn: (h) => `
<p>Schiebst du eine Figur auf dem Tisch, ohne sie zu drehen, dann bewegt sich jeder Punkt gleich weit in dieselbe Richtung.
Das ist eine <b>Parallelverschiebung</b> (kurz: Verschiebung).</p>
<div class="merk"><b>Merke</b> Bei einer <b>Verschiebung</b> werden alle Punkte gleich weit in dieselbe Richtung verschoben.
Das gibt ein <b>Verschiebungspfeil</b> an – oder ein Satz wie „um 3 Kästchen nach rechts und 2 nach oben“.</div>
${h.svgGridFig({ w: 10, h: 6, shapes: [{ kind: 'arrow', from: [1, 5], to: [4, 3], cls: 'vec' }, { kind: 'arrow', from: [3, 5], to: [6, 3], cls: 'vec' }, { kind: 'arrow', from: [2, 3], to: [5, 1], cls: 'vec' }]

      if (half.some((p) => p[0] === 0 && p[1] === 0)) continue;

      const broken = h.chance(0.5);

  function freeArrow(W, H, dx, dy, pts, img) {
    const used = new Set(pts.concat(img).map(key));
    let best = null;
    for (let tr = 0; tr < 300; tr++) {
      const s = [h.rnd(0, W), h.rnd(0, H)], e = [s[0] + dx, s[1] + dy];
      if (!inside(s, W, H) || !inside(e, W, H)) continue;
      const all = pts.concat(img);
      const dmin = Math.min.apply(null, all.map((p) => Math.min(Math.hypot(p[0] - s[0], p[1] - s[1]), Math.hypot(p[0] - e[0], p[1] - e[1]))));
      if (used.has(key(s)) || used.has(key(e))) continue;
      if (!best || dmin > best.d) best = { s: s, e: e, d: dmin };
      if (dmin >= 2.5) break;
    }
    return best;
  }

<p>Bei einer Umfrage oder einem Versuch sammelst du <b>Daten</b>. Beim Zählen hilft eine <b>Strichliste</b>: Für jede Antwort machst du einen Strich. Jeder fünfte Strich wird quer durch die vier davor gezogen – so kannst du in Fünferbündeln zählen.</p>
${h.table(['Haustier', 'Strichliste', 'Anzahl'], [['Hund', tally(7), '7'], ['Katze', tally(5), '5'], ['Kaninchen', tally(3), '3'], ['keins', tally(10), '10']])}
<p>Die Tabelle mit den Anzahlen heißt <b>Häufigkeitstabelle</b>. Insgesamt wurden 7 + 5 + 3 + 10 = 25 Kinder befragt.</p>
<div class="merk"><b>Merke</b> Die <b>absolute Häufigkeit</b> gibt an, <i>wie oft</i> ein Ergebnis vorkommt.<br>
Die <b>relative Häufigkeit</b> gibt den <i>Anteil</i> an allen Ergebnissen an:<br>
relative Häufigkeit = absolute Häufigkeit : Gesamtzahl</div>
<div class="bsp"><b>Beispiel</b> 7 von 25 Kindern haben einen Hund.<br>
relative Häufigkeit: ${h.fr(7, 25)} = ${h.fr(28, 100)} = 0,28 = 28 %</div>
<p>Die relative Häufigkeit kannst du als <b>Bruch</b>, als <b>Dezimalzahl</b> oder in <b>Prozentschreibweise</b> angeben. „Prozent“ heißt „von Hundert“: 28 % = ${h.fr(28, 100)} = 0,28. Ebenso ist ${h.fr(1, 4)} = 0,25 = 25 % und ${h.fr(1, 2)} = 0,5 = 50 %.</p>
<div class="tipp"><b>Tipp</b> Mit relativen Häufigkeiten kannst du Gruppen unterschiedlicher Größe vergleichen: 6 von 20 (0,3) ist ein größerer Anteil als 7 von 25 (0,28) – obwohl 7 mehr ist als 6.</div>
<div class="merk"><b>Merke</b> Alle absoluten Häufigkeiten zusammen ergeben die Gesamtzahl. Alle relativen Häufigkeiten zusammen ergeben <b>1</b> (also 100 %).</div>`,
        gens: { 1: ['k7_hf_zaehlen', 'k7_hf_strich', 'k7_hf_rel_bruch'], 2: ['k7_hf_strich', 'k7_hf_rel_dez', 'k7_hf_luecke', 'k7_hf_prozent'], 3: ['k7_hf_umkehr', 'k7_hf_vergleich', 'k7_hf_tf'] }

<p>Mit Diagrammen kann man Häufigkeiten auf einen Blick erfassen. Die wichtigsten Arten:</p>
<h3>Säulen- und Balkendiagramm</h3>
<p>Jede Säule steht für ein Ergebnis. Die <b>Höhe</b> zeigt die Häufigkeit – an der Hochachse kannst du sie ablesen. Liegen die Säulen waagerecht, spricht man von einem <b>Balkendiagramm</b>.</p>
${h.svgBars({ cats: ['Bus', 'Rad', 'zu Fuß', 'Auto'], vals: [8, 10, 4, 2], step: 2 })}
<div class="bsp"><b>Beispiel</b> Am Säulendiagramm liest du ab: 10 Kinder kommen mit dem Rad, 4 zu Fuß. Mit dem Rad kommen also 6 Kinder mehr als zu Fuß.</div>
<h3>Kreis- und Streifendiagramm</h3>
<p>Hier ist das <b>Ganze</b> (alle Befragten) ein Kreis oder ein Streifen. Jedes Ergebnis bekommt ein Stück, das so groß ist wie seine <b>relative Häufigkeit</b>.</p>
${h.svgPieChart([{ v: 2, t: 'Hund (½)' }, { v: 1, t: 'Katze (¼)' }, { v: 1, t: 'keins (¼)' }])}
<div class="merk"><b>Merke</b> Im Kreisdiagramm gehört zu jedem Anteil ein Winkel: relative Häufigkeit · 360°. Beispiel: ${h.fr(1, 4)} · 360° = 90°.<br>
Im Streifendiagramm gehört zu jedem Anteil eine Länge: relative Häufigkeit · Gesamtlänge.</div>
<h3>Vorsicht, Täuschung!</h3>
<div class="tipp"><b>Tipp</b> Schau immer auf die Achsen! Beginnt die Hochachse nicht bei 0, sehen kleine Unterschiede riesig aus. Auch ungleiche Abstände auf der Achse oder fehlende Beschriftungen können täuschen. Lies deshalb immer die Werte ab, statt nur die Säulenhöhen zu vergleichen.</div>`,

<p>Wenn Daten sehr viele verschiedene Werte haben, wird eine Strichliste für jeden einzelnen Wert unübersichtlich. Dann fasst man die Werte in <b>Klassen</b> zusammen.</p>

${dataTable([12, 5, 23, 18, 7, 31, 15, 9, 26, 14, 11, 20], 6)}
${h.table(['Minuten', '0–9', '10–19', '20–29', '30–39'], [['Anzahl', '3', '5', '3', '1']])}</div>
<div class="merk"><b>Merke</b> Bei einer <b>Klasseneinteilung</b> teilt man die Werte in Bereiche (Klassen) ein, z. B. 0–9, 10–19, 20–29 … Alle Klassen sind gleich breit, jeder Wert gehört zu <b>genau einer</b> Klasse. Dann zählt man, wie viele Werte in jeder Klasse liegen.</div>
<div class="tipp"><b>Tipp</b> Achte auf die Grenzen: 20 gehört zur Klasse 20–29, nicht zu 10–19. Streiche beim Zählen jeden Wert ab, damit du keinen vergisst oder doppelt zählst. Zum Schluss prüfst du: Die Summe der Anzahlen muss die Gesamtzahl ergeben.</div>

<div class="bsp"><b>Beispiel</b> Soll der Mittelwert von 4, 7 und □ genau 6 sein, müssen alle drei Werte zusammen 3 · 6 = 18 ergeben. Also □ = 18 − 4 − 7 = 7.</div>`,

      sol: 'Rest nach ' + n1 + ': 1 − ' + FR(f1) + ' = ' + FR(r1) + '<br>' + n2 + ' isst ' + FR(f2) + ' von ' + FR(r1) + ': ' + FR(f2) + ' · ' + FR(r1) + ' = ' + h.fr(f2.n * r1.n, f2.d * r1.d) + (eat2.d !== f2.d * r1.d ? ' = ' + FR(eat2) : '') + '<br>' +
        'Übrig: ' + FR(r1) + ' − ' + FR(eat2) + ' = ' + FR(rest) + '<br>Antwort: ' + (askTim ? n2 + ' hat <b>' + FR(eat2) + '</b> ' + dem + ' gegessen.' : 'Es bleibt <b>' + FR(rest) + '</b> ' + dem + ' übrig.')

  gen('k9_saft', (h, o) => {

  // Zahlenstrahl zum Antippen

      let s = '<defs><clipPath id="' + cid + '"><rect x="' + (G.m - 10) + '" y="' + (G.m - 10) + '" width="' + (t.w * G.c + 20) + '" height="' + (t.h * G.c + 20) + '"/></clipPath></defs>' +
        h.gridBack(t.w, t.h) + '<g clip-path="url(#' + cid + ')">' + h.gridShapes({ w: t.w, h: t.h, shapes: t.shapes || [] }) + '</g>';

      pts.forEach((p, i) => { s += '<circle cx="' + h.gx(p.x) + '" cy="' + h.gx(p.y) + '" r="6" class="gpt user"/>' + (names[i] ? '<text x="' + (h.gx(p.x) + 8) + '" y="' + (h.gx(p.y) - 8) + '" class="glb user">' + esc(names[i]) + '</text>' : ''); });
      box.innerHTML = '<p class="small muted center" style="margin:0 0 4px">Tippe ' + (t.targets.length > 1 ? 'die ' + t.targets.length + ' Punkte ' + (names.length ? '(' + names.join(', ') + ') der Reihe nach ' : '') : 'den Punkt ') + 'auf den Gitterpunkten an. Nochmal tippen entfernt einen Punkt.</p>' +
        '<svg class="fig grid" viewBox="0 0 ' + W + ' ' + H + '" style="max-width:' + Math.max(W, 300) + 'px;touch-action:manipulation;cursor:pointer" xmlns="http://www.w3.org/2000/svg">' + s + '</svg>' +

  IN.angle = (t, box) => {
    const rot = t.rot || 0, A = h.ANG;

    if (Math.abs(deg - t.target) < 25) deg = (deg + 70) % 360;
    let locked = false, revealOk = null, dragging = false;
    const draw = () => {
      let extra = '';
      if (revealOk === false) { const e = h.angPt(rot + t.target, A.R); extra += '<line x1="' + A.cx + '" y1="' + A.cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '" class="leg ok"/>'; }
      const e = h.angPt(rot + deg, A.R), hp = h.angPt(rot + deg, A.R - 4);
      if (!locked) extra += '<circle cx="' + hp[0].toFixed(1) + '" cy="' + hp[1].toFixed(1) + '" r="22" class="handle-ring"/><circle cx="' + e[0].toFixed(1) + '" cy="' + e[1].toFixed(1) + '" r="9" class="handle"/>';

  /* ================= Antwort als HTML (Rückblick) ================= */

  App.respHTML = (t, r) => {

  function onMain(root, P) {
    const t = P.tasks[P.i];
    if (P.phase === 'feedback') { next(P); return; }
    const r = P.inp.get();
    if (P.inp.empty(r)) { App.toast(P.inp.emptyMsg || 'Gib zuerst eine Antwort ein.'); return; }
    const res = M6.check(t, r);
    P.lastR = r;
    if (P.mode === 'test') {
      P.res[P.i] = { ok: res.ok, first: true, r: r };

    }
    P.tries++;
    const fbw = $('.fbw', root), main = $('[data-main]', root);
    const canRetry = (P.tries === 1 && t.type !== 'tf' && !(t.type === 'mc' && t.choices.length <= 2)) || (res.note && P.tries === 2);
    if (res.ok) {
      const lvl = P.o.kind === 'warm' ? 0 : P.o.stage;
      const xp = lvl ? Math.ceil(BASE_XP[lvl] / (P.tries === 1 ? 1 : 2)) : P.tries === 1 ? 5 : 3;

        '<div class="acts"><button class="btn sm ghost" data-sol>Lösungsweg ansehen</button></div><div class="sol hidden">' + t.sol + '</div></div>';

  /* ================= Auswertung ================= */
  function gradeOf(pct) { return pct >= 92 ? 1 : pct >= 81 ? 2 : pct >= 67 ? 3 : pct >= 50 ? 4 : pct >= 30 ? 5 : 6; }
  function finish(P) {
    const S = App.S, o = P.o, n = P.tasks.length;
    const ok = P.res.filter((r) => r && r.ok).length, first = P.res.filter((r) => r && r.ok && r.first).length;

    let xp = 0;

  function heatmap() {

  /* ================= Spiel: Bruch-Treffer ================= */
  function gameTarget(i) {
